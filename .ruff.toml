# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py313"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Use of assert detected (required for pytest)
    "SLF001",  # Private member accessed (testing private methods)
    "PLR2004", # Magic value used in comparison (common in tests)
    "PTH118",  # os.path.join should be replaced by Path (compatibility in tests)
    "PTH120",  # os.path.dirname should be replaced by Path.parent (compatibility in tests)
]
"custom_components/ha_predictions/ml/evaluation.py" = [
    "EM101",  # Existing validation messages are clearest at the raise site
    "TRY003", # Existing validation messages are clearest at the raise site
]
"custom_components/ha_predictions/ml/model.py" = [
    "EM101",   # Existing validation messages are clearest at the raise site
    "PLR0915", # Training pipeline is intentionally kept in one function
    "TRY003",  # Existing validation messages are clearest at the raise site
]
"scripts/**/*.py" = [
    "EM102",   # CLI errors include dynamic API details
    "FBT001",  # Boolean states map directly to Home Assistant service calls
    "FBT003",  # Boolean states map directly to Home Assistant service calls
    "PLR2004", # Scenario constants make simulations readable
    "S310",    # URLs are supplied by the developer running the local script
    "S311",    # Simulation randomness is intentionally non-cryptographic
    "T201",    # CLI scripts report progress on stdout
    "TRY003",  # CLI errors are constructed at their call sites
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
